<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>搞定英语 · 高考词汇轻松背</title>
  <link rel="icon" type="image/png" href="/img/favicon.png?v=20260910h" />
  <link rel="stylesheet" href="/css/style.css?v=20260910h" />
  <style>
    /* 播放器兜底样式（内联，防 CSS 缓存导致布局失效）：按钮与倍速同行，进度条独立一行并可拖动 */
    .lst-player { gap: 8px; flex-wrap: wrap; row-gap: 10px; padding: 12px 14px; }
    .lst-play-btn { height: 28px; min-width: 36px; padding: 0 8px; font-size: 11px; border-radius: 6px; }
    .lst-play-btn svg { width: 12px; height: 12px; }
    .lst-speed { margin-left: auto; }
    .lst-speed button { height: 28px; min-width: 36px; padding: 0 8px; }
    .lst-progress { order: 3; flex: 1 1 100%; min-width: 100%; }
    .lst-bar { height: 8px; border-radius: 4px; cursor: pointer; touch-action: none; }
    .lst-time { justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <span class="logo">
            <img class="logo-img" src="/img/logo-icon.png?v=20260910h" alt="搞定英语" />
          </span>
          <div class="brand-text">
            <h1><img class="logo-text" src="/img/logo-text.png?v=20260910h" alt="搞定英语" /></h1>
            <p class="slogan">科学训练&ensp;高效学习</p>
          </div>
        </div>
        <div class="header-actions">
          <span id="authArea"><button class="auth-btn" id="loginBtn" title="登录 / 注册">登录</button></span>
          <span id="diffBadge" class="diff-badge all" title="当前难度范围">全部</span>
          <button class="icon-btn" id="menuBtn" title="更多（统计/导入）" aria-label="更多"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg></button>
          <button class="icon-btn" id="settingsBtn" title="系统设置" aria-label="系统设置"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        </div>
      </div>
      <div class="header-menu" id="headerMenu" hidden>
        <button data-page="stats"><svg class="vico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="4" height="8" rx="1"/><rect x="15" y="6" width="4" height="12" rx="1"/></svg>学习统计</button>
        <button data-page="import"><svg class="vico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>数据导入</button>
      </div>
      <div class="header-stat" id="headerStat"></div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar">
      <div class="tabbar-inner">
        <button class="tab active" data-page="overview" aria-label="概览"><svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .7-1.5l7-6a2 2 0 0 1 2.6 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>概览</span></button>
        <button class="tab" data-page="dictation" aria-label="快筛"><svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>快筛</span></button>
        <button class="tab" data-page="category" aria-label="分类记"><svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg><span>分类记</span></button>
        <button class="tab" data-page="reading" aria-label="阅读记"><svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg><span>阅读记</span></button>
        <button class="tab" data-page="listening" aria-label="听力"><svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Z"/><path d="M21 14h-3a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-5Z"/></svg><span>听力</span></button>
        <button class="tab" data-page="notebook" aria-label="生词本"><svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.4l6-.9z"/></svg><span>生词本</span></button>
        <button class="tab" data-page="wrongbook" aria-label="错词本"><svg class="tico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M10 2v8l3-3 3 3V2"/></svg><span>错词本</span></button>
      </div>
    </nav>
  </div>

  <!-- 全局弹窗容器 -->
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <!-- 单文件经典脚本：内嵌词库 + 安全 fetch，file:// 双击打开也能渲染内容 -->
  <script src="/js/app.bundle.js?v=20260910h" defer></script>
</body>
</html>
